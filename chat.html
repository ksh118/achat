<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codetbase - 해설 채팅</title>
    <style>
        body { font-family: sans-serif; background: #abc1d1; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background: #444; color: white; padding: 15px; font-weight: bold; text-align: center; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 15px; line-height: 1.6; font-size: 14px; }
        .my-msg { align-self: flex-end; background: #fee500; border-top-right-radius: 2px; }
        .my-msg img { width: 100%; border-radius: 10px; display: block; }
        .ai-msg { align-self: flex-start; background: #fff; border-top-left-radius: 2px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="chat-header">🤖 codetbase AI 선생님</div>
    <div class="chat-area" id="chatArea"></div>

    <script>
        const chatArea = document.getElementById('chatArea');
        // 사용자님의 API 키
        const API_KEY = "AIzaSyAzF6xtF1ncr4CHSAWJWdrJ4pD4DJTxpvs";
        const imgData = localStorage.getItem('temp_image');

        window.onload = async () => {
            if (!imgData) return window.location.href = 'index.html';

            addMessage('me', `<img src="${imgData}">`);
            const loadingId = addMessage('ai', "문제를 정밀 분석 중입니다...");

            try {
                // 404 에러 방지를 위한 가장 정확한 주소 형식 (v1beta1 사용)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "이 이미지의 문제를 풀어서 정답과 풀이를 한국어로 자세히 설명해줘. 영어 문제라면 해석도 포함해줘." },
                                { inline_data: { mime_type: "image/jpeg", data: imgData.split(',')[1] } }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    document.getElementById(loadingId).innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    // 에러 발생 시 구체적인 이유 출력
                    document.getElementById(loadingId).innerText = "시스템 에러: " + data.error.message;
                } else {
                    document.getElementById(loadingId).innerText = "인식 실패. 글자가 잘 보이게 다시 찍어주세요.";
                }
            } catch (e) {
                document.getElementById(loadingId).innerText = "연결 실패: " + e.message;
            }
        };

        function addMessage(sender, content) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = `msg ${sender === 'me' ? 'my-msg' : 'ai-msg'}`;
            div.innerHTML = `<div id="${id}">${content}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
