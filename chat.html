<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codetbase - 해설</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        img { width: 100%; border-radius: 10px; margin-bottom: 15px; }
        .text { white-space: pre-wrap; line-height: 1.8; color: #333; }
        .back { text-decoration: none; color: #667eea; font-weight: bold; display: block; margin-bottom: 15px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 다시 촬영하기</a>
    <div class="card"><img id="qImg"></div>
    <div class="card"><h3>✅ AI 선생님의 풀이</h3><div id="ansText" class="text"></div></div>

    <script>
        document.getElementById('qImg').src = localStorage.getItem('last_image');
        document.getElementById('ansText').innerText = localStorage.getItem('last_answer');
    </script>
</body>
</html>
