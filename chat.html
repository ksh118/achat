<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codetbase - 해설 채팅</title>
    <style>
        /* 사용자님이 원하시는 카톡 스타일 디자인 */
        body { font-family: 'Noto Sans KR', sans-serif; background: #abc1d1; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background: #444; color: white; padding: 15px; font-weight: bold; text-align: center; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 15px; line-height: 1.6; font-size: 14px; word-break: break-all; }
        .my-msg { align-self: flex-end; background: #fee500; color: #000; border-top-right-radius: 2px; }
        .my-msg img { width: 100%; border-radius: 10px; display: block; }
        .ai-msg { align-self: flex-start; background: #fff; color: #000; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .loading-dots:after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } }
    </style>
</head>
<body>
    <div class="chat-header">🤖 codetbase AI 선생님</div>
    <div class="chat-area" id="chatArea"></div>

    <script>
        const chatArea = document.getElementById('chatArea');
        // 사용자님의 API 키
        const API_KEY = "AIzaSyAzF6xtF1ncr4CHSAWJWdrJ4pD4DJTxpvs";
        const imgData = localStorage.getItem('temp_image');

        window.onload = async () => {
            if (!imgData) return window.location.href = 'index.html';

            // 1. 내 사진 메시지 (노란색)
            addMessage('me', `<img src="${imgData}">`);
            
            // 2. AI 대기 메시지 (흰색)
            const loadingId = addMessage('ai', `<span class="loading-dots">문제를 풀고 있습니다</span>`);

            try {
                // 구글 Gemini 1.5 Flash 모델 호출 주소
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                // Base64 데이터에서 헤더 제거
                const pureBase64 = imgData.split(',')[1];

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "이 이미지에 있는 문제를 풀어서 정답과 상세한 풀이 과정을 한국어로 설명해줘." },
                                { inline_data: { mime_type: "image/jpeg", data: pureBase64 } }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                // 3. 응답 결과 화면에 뿌리기
                if (data.candidates && data.candidates[0].content) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    // 마크다운 형식이나 줄바꿈을 처리하기 위해 innerText 사용
                    document.getElementById(loadingId).innerText = aiResponse;
                } else {
                    console.error("API 응답 오류:", data);
                    document.getElementById(loadingId).innerText = "문제를 인식하지 못했습니다. 더 밝은 곳에서 글자가 잘 보이게 다시 찍어주세요!";
                }
            } catch (e) {
                document.getElementById(loadingId).innerText = "서버 연결에 실패했습니다. 인터넷 연결을 확인해주세요.";
            }
        };

        function addMessage(sender, content) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = `msg ${sender === 'me' ? 'my-msg' : 'ai-msg'}`;
            div.innerHTML = `<div id="${id}">${content}</div>`;
            chatArea.appendChild(div);
            // 자동 스크롤
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
