<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codetbase - AI 해설</title>
    <style>
        body { font-family: sans-serif; background: #abc1d1; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background: #444; color: white; padding: 15px; font-weight: bold; text-align: center; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 15px; line-height: 1.6; font-size: 14px; }
        .my-msg { align-self: flex-end; background: #fee500; border-top-right-radius: 2px; }
        .my-msg img { width: 100%; border-radius: 10px; display: block; }
        .ai-msg { align-self: flex-start; background: #fff; border-top-left-radius: 2px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="chat-header">🤖 codetbase AI 선생님</div>
    <div class="chat-area" id="chatArea"></div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const API_KEY = "AIzaSyAzF6xtF1ncr4CHSAWJWdrJ4pD4DJTxpvs"; //
        const imgData = localStorage.getItem('temp_image');

        window.onload = async () => {
            if (!imgData) return window.location.href = 'index.html';

            addMessage('me', `<img src="${imgData}">`);
            const loadingId = addMessage('ai', "문제를 분석하고 있습니다 (영어/수학 모두 가능)...");

            try {
                // 안정적인 v1 API 사용
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                const pureBase64 = imgData.split(',')[1];

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "너는 만능 AI 선생님이야. 이미지에 영어 지문이나 수학 문제가 있다면 이를 정확히 읽고, '정답'과 '상세한 해설'을 한국어로 작성해줘. 영어 문장은 해석도 포함해줘." },
                                { inline_data: { mime_type: "image/jpeg", data: pureBase64 } }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    document.getElementById(loadingId).innerText = data.candidates[0].content.parts[0].text;
                } else {
                    document.getElementById(loadingId).innerText = "인식에 실패했습니다. 사진을 더 밝고 선명하게 찍어보세요.";
                }
            } catch (e) {
                document.getElementById(loadingId).innerText = "오류 발생: " + e.message;
            }
        };

        function addMessage(sender, content) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = `msg ${sender === 'me' ? 'my-msg' : 'ai-msg'}`;
            div.innerHTML = `<div id="${id}">${content}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
