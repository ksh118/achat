<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codetbase - 채팅</title>
    <style>
        body { font-family: sans-serif; background: #abc1d1; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .chat-header { background: #444; color: white; padding: 15px; font-weight: bold; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; line-height: 1.5; font-size: 14px; }
        .my-msg { align-self: flex-end; background: #fee500; }
        .my-msg img { width: 100%; border-radius: 10px; }
        .ai-msg { align-self: flex-start; background: #fff; }
    </style>
</head>
<body>
    <div class="chat-header">🤖 AI 선생님</div>
    <div class="chat-area" id="chatArea"></div>

    <script>
        const chatArea = document.getElementById('chatArea');
        // 사용자님의 실제 키
        const API_KEY = "AIzaSyAzF6xtF1ncr4CHSAWJWdrJ4pD4DJTxpvs";
        const imgData = localStorage.getItem('temp_image');

        window.onload = async () => {
            if (!imgData) return window.location.href = 'index.html';

            // 1. 내 사진 먼저 띄우기
            addMessage('me', `<img src="${imgData}">`);
            
            // 2. AI 답변용 말풍선 생성
            const loadingId = addMessage('ai', "분석 중...");

            try {
                // [중요] 404 에러 방지를 위한 수정된 주소
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "이 문제의 정답과 풀이를 한국어로 자세히 설명해줘." },
                                { inline_data: { mime_type: "image/jpeg", data: imgData.split(',')[1] } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    document.getElementById(loadingId).innerText = data.candidates[0].content.parts[0].text;
                } else {
                    document.getElementById(loadingId).innerText = "AI가 답을 찾지 못했어요. 다시 찍어주세요.";
                }
            } catch (e) {
                document.getElementById(loadingId).innerText = "연결 오류가 발생했습니다.";
            }
        };

        function addMessage(sender, content) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = `msg ${sender === 'me' ? 'my-msg' : 'ai-msg'}`;
            div.innerHTML = `<div id="${id}">${content}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
