<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>codetbase - AI 문제 풀이</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 디자인 가이드 반영 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #000; overflow: hidden; height: 100vh; }
        .header { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); color: white; padding: 15px; position: fixed; top: 0; width: 100%; z-index: 100; text-align: center; font-weight: 700; }
        video, #preview { width: 100%; height: 100vh; object-fit: cover; position: absolute; top: 0; left: 0; }
        #preview { display: none; z-index: 10; }
        .controls { position: fixed; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 100; }
        .shutter { width: 80px; height: 80px; background: white; border: 6px solid #667eea; border-radius: 50%; cursor: pointer; }
        .btn { display: none; padding: 16px 32px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 16px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .retake-btn { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px); border: 1px solid white; }
        .solve-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>
    <div id="loading" class="loading"><div>분석 중... 잠시만 기다려주세요.</div></div>
    <div class="header">🤖 codetbase</div>

    <video id="video" autoplay playsinline muted></video>
    <img id="preview">

    <div class="controls">
        <div id="shutter" class="shutter" onclick="takePhoto()"></div>
        <button id="retakeBtn" class="btn retake-btn" onclick="retake()">다시 찍기</button>
        <button id="solveBtn" class="btn solve-btn" onclick="askAI()">질문하기</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const preview = document.getElementById('preview');
        const shutter = document.getElementById('shutter');
        const retakeBtn = document.getElementById('retakeBtn');
        const solveBtn = document.getElementById('solveBtn');
        let capturedData = null;

        // 실제 API 키
        const API_KEY = "AIzaSyAzF6xtF1ncr4CHSAWJWdrJ4pD4DJTxpvs";

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(s => video.srcObject = s);

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedData = canvas.toDataURL('image/jpeg', 0.8);
            preview.src = capturedData;
            preview.style.display = 'block';
            video.style.display = 'none';
            shutter.style.display = 'none';
            retakeBtn.style.display = 'block';
            solveBtn.style.display = 'block';
        }

        function retake() {
            preview.style.display = 'none';
            video.style.display = 'block';
            shutter.style.display = 'block';
            retakeBtn.style.display = 'none';
            solveBtn.style.display = 'none';
        }

        async function askAI() {
            document.getElementById('loading').style.display = 'flex';
            try {
                // 에러 방지를 위해 서버 없이 직접 호출
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [
                            { text: "이 문제의 정답과 풀이를 한국어로 아주 자세히 설명해줘." },
                            { inline_data: { mime_type: "image/jpeg", data: capturedData.split(',')[1] } }
                        ]}]
                    })
                });
                const data = await res.json();
                if (data.candidates) {
                    localStorage.setItem('last_img', capturedData);
                    localStorage.setItem('last_ans', data.candidates[0].content.parts[0].text);
                    window.location.href = 'chat.html';
                }
            } catch (e) {
                alert("분석 실패: " + e.message);
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
