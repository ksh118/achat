<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>codetbase - AI 학습 도우미</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #000; overflow: hidden; height: 100vh; color: white; }
        .header { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; position: fixed; width: 100%; top: 0; z-index: 100; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .cross { font-size: 50px; color: rgba(255,255,255,0.4); font-weight: 100; }
        .shutter { width: 75px; height: 75px; background: white; border: 5px solid #ff2d55; border-radius: 50%; cursor: pointer; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); transition: transform 0.1s; }
        .shutter:active { transform: translateX(-50%) scale(0.9); }
        .loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff2d55; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" class="loading"><div class="spinner"></div><p>AI가 분석 중입니다...</p></div>
    <div class="header"><strong>🤖 codetbase</strong> <span onclick="location.href='history.html'" style="cursor:pointer; background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:15px; font-size:13px;">기록보기</span></div>
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay"><div class="cross">+</div></div>
    <div class="shutter" onclick="capture()"></div>

    <script>
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(s => video.srcObject = s)
            .catch(e => alert('카메라를 켤 수 없습니다.'));

        async function capture() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imgData = canvas.toDataURL('image/jpeg', 0.8);
            const base64 = imgData.split(',')[1];
            
            loading.style.display = 'flex';

            try {
                const res = await fetch('/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64 })
                });
                const data = await res.json();

                if (data.answer) {
                    const sessions = JSON.parse(localStorage.getItem('chat_sessions') || '[]');
                    const newSession = {
                        id: Date.now(),
                        image: base64,
                        messages: [
                            { type: 'user', image: imgData, content: '문제 풀이 요청' },
                            { type: 'ai', content: data.answer }
                        ],
                        createdAt: Date.now()
                    };
                    sessions.unshift(newSession);
                    localStorage.setItem('chat_sessions', JSON.stringify(sessions));
                    window.location.href = 'chat.html';
                } else {
                    throw new Error(data.error);
                }
            } catch (e) { 
                alert('에러: ' + e.message); 
                loading.style.display = 'none'; 
            }
        }
    </script>
</body>
</html>
