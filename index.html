<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>codetbase - Camera</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .crosshair { font-size: 40px; color: rgba(255,255,255,0.6); font-weight: 200; }
        .shutter-btn { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 75px; height: 75px; background: white; border: 6px solid #ff2d55; border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .nav-icons { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-around; font-size: 26px; }
        .nav-icons span { cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="loading"><div>분석 중...</div></div>
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay"><div class="crosshair">+</div></div>
        <div class="shutter-btn" onclick="takePhoto()"></div>
        <div class="nav-icons">
            <span onclick="location.href='g.html'">🖼️</span>
            <span>⚡</span>
            <span onclick="location.href='g.html'">🕒</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("카메라를 활성화할 수 없습니다."));

        async function takePhoto() {
            loading.style.display = 'flex';
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg');
            const base64Image = imageData.split(',')[1];

            try {
                const response = await fetch('/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                const result = await response.json();
                
                if (result.answer) {
                    const history = JSON.parse(localStorage.getItem('codetbase_history') || '[]');
                    history.unshift({ img: imageData, answer: result.answer });
                    localStorage.setItem('codetbase_history', JSON.stringify(history));
                    location.href = 'g.html';
                } else {
                    throw new Error(result.error || "알 수 없는 에러");
                }
            } catch (e) {
                alert("에러 발생: " + e.message);
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
