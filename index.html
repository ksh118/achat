<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>codetbase</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .crosshair { font-size: 40px; color: rgba(255,255,255,0.5); }
        .shutter { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; background: white; border: 5px solid #ff2d55; border-radius: 50%; cursor: pointer; }
        .nav { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; font-size: 24px; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="loading">분석 중...</div>
    <video id="v" autoplay playsinline></video>
    <div class="overlay"><div class="crosshair">+</div></div>
    <div class="shutter" onclick="take()"></div>
    <div class="nav">
        <span onclick="location.href='g.html'">🖼️</span>
        <span onclick="location.href='g.html'">🕒</span>
    </div>

    <script>
        const v = document.getElementById('v');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => v.srcObject = s);

        async function take() {
            document.getElementById('loading').style.display = 'flex';
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const img = c.toDataURL('image/jpeg');
            const base64 = img.split(',')[1];

            try {
                const res = await fetch('/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64 })
                });
                const data = await res.json();
                
                if (data.answer) {
                    const h = JSON.parse(localStorage.getItem('cb_history') || '[]');
                    // [핵심] [object Object] 방지를 위해 data.answer(문자열)를 직접 저장
                    h.unshift({ img: img, ans: data.answer });
                    localStorage.setItem('cb_history', JSON.stringify(h));
                    location.href = 'g.html';
                }
            } catch (e) { alert("오류 발생"); }
        }
    </script>
</body>
</html>
