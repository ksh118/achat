<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>codetbase - 촬영</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; }
        video, #preview { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #preview { display: none; z-index: 10; }
        .controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 100; }
        .shutter { width: 75px; height: 75px; background: white; border-radius: 50%; border: 5px solid #667eea; cursor: pointer; }
        .btn { display: none; padding: 15px 25px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .retake { background: #444; }
        .go-chat { background: #667eea; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <img id="preview">
    <div class="controls">
        <div id="shutter" class="shutter" onclick="takePhoto()"></div>
        <button id="retakeBtn" class="btn retake" onclick="retake()">다시 찍기</button>
        <button id="chatBtn" class="btn go-chat" onclick="goToChat()">질문하기</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const preview = document.getElementById('preview');
        const shutter = document.getElementById('shutter');
        const chatBtn = document.getElementById('chatBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        let capturedImg = "";

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImg = canvas.toDataURL('image/jpeg', 0.8);
            preview.src = capturedImg;
            preview.style.display = 'block';
            shutter.style.display = 'none';
            chatBtn.style.display = 'block';
            retakeBtn.style.display = 'block';
        }

        function retake() {
            preview.style.display = 'none';
            shutter.style.display = 'block';
            chatBtn.style.display = 'none';
            retakeBtn.style.display = 'none';
        }

        function goToChat() {
            localStorage.setItem('temp_image', capturedImg);
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
