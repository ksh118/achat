<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>codetbase - Camera</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; color: rgba(255,255,255,0.5); }
        .top-bar { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .shutter-btn { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: white; border: 5px solid #ff2d55; border-radius: 50%; cursor: pointer; }
        .nav-icons { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay"><div class="crosshair">+</div></div>
        
        <div class="top-bar">
            <span>5:19</span>
            <div style="background:black; width:100px; height:30px; border-radius:15px;"></div>
            <span>LTE 59</span>
        </div>

        <div class="shutter-btn" onclick="takePhoto()"></div>

        <div class="nav-icons">
            <span onclick="location.href='g.html'">🖼️</span>
            <span>⚡</span>
            <span onclick="location.href='g.html'">🕒</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');

        // 카메라 시작
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("카메라를 켤 수 없습니다: " + err));

        async function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/png');

            // AI 호출 및 저장 로직 (가상 API 호출)
            alert("문제를 분석 중입니다. 잠시만 기다려주세요...");
            
            // 실제 구현시 여기서 Gemini API를 호출합니다.
            const dummyResponse = "정답은 2번입니다. 문맥상 'is preparing'과 'making'이 가장 자연스럽습니다.";
            
            const history = JSON.parse(localStorage.getItem('study_history') || '[]');
            history.unshift({
                img: imageData,
                answer: dummyResponse,
                date: new Date().toLocaleString()
            });
            localStorage.setItem('study_history', JSON.stringify(history));

            location.href = 'g.html';
        }
    </script>
</body>
</html>
