<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>codetbase - 문제 촬영</title>
    <style>
        /* 기존 디자인 유지 */
        body { margin: 0; background: #000; font-family: sans-serif; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .header { background: rgba(0,0,0,0.7); padding: 15px 20px; display: flex; justify-content: space-between; position: absolute; top:0; width: 100%; z-index: 100; }
        video, #preview { width: 100%; height: 100%; object-fit: cover; }
        #preview { display: none; }
        .controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 100; }
        .shutter { width: 80px; height: 80px; background: white; border: 6px solid #667eea; border-radius: 50%; cursor: pointer; }
        .btn { padding: 15px 25px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; display: none; }
        .loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="loading" class="loading"><div>AI가 분석 중...</div></div>
    <div class="header"><strong>🤖 codetbase</strong></div>
    
    <video id="video" autoplay playsinline muted></video>
    <img id="preview" alt="촬영된 사진">

    <div class="controls">
        <div id="shutter" class="shutter" onclick="takePhoto()"></div>
        <button id="retakeBtn" class="btn" style="background:#444; color:white;" onclick="retake()">다시 찍기</button>
        <button id="askBtn" class="btn" style="background:#667eea; color:white;" onclick="ask()">질문하기</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const preview = document.getElementById('preview');
        const shutter = document.getElementById('shutter');
        const askBtn = document.getElementById('askBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        let capturedBase64 = "";

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => video.srcObject = s);

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedBase64 = canvas.toDataURL('image/jpeg', 0.8);
            
            // 사진 정지(미리보기) 로직
            preview.src = capturedBase64;
            preview.style.display = 'block';
            video.style.display = 'none';
            
            shutter.style.display = 'none';
            askBtn.style.display = 'block';
            retakeBtn.style.display = 'block';
        }

        function retake() {
            preview.style.display = 'none';
            video.style.display = 'block';
            shutter.style.display = 'block';
            askBtn.style.display = 'none';
            retakeBtn.style.display = 'none';
        }

        async function ask() {
            document.getElementById('loading').style.display = 'flex';
            try {
                const res = await fetch('/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: capturedBase64.split(',')[1] })
                });
                const data = await res.json();
                
                if (data.answer) {
                    const session = { 
                        id: Date.now(), 
                        image: capturedBase64, 
                        messages: [{ type: 'ai', content: data.answer }] 
                    };
                    const sessions = JSON.parse(localStorage.getItem('chat_sessions') || '[]');
                    sessions.unshift(session);
                    localStorage.setItem('chat_sessions', JSON.stringify(sessions));
                    window.location.href = 'chat.html';
                } else { throw new Error(data.error); }
            } catch (e) {
                alert('에러 발생: ' + e.message);
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
