<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>codetbase - 문제 촬영</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #000; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .header { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: absolute; top: 0; width: 100%; z-index: 100; }
        .camera-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .capture-btn { width: 80px; height: 80px; background: white; border: 6px solid #667eea; border-radius: 50%; cursor: pointer; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; color: white; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-weight:700;">🤖 codetbase</div>
        <button onclick="location.href='history.html'" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:8px 16px; border-radius:20px; font-size:13px; cursor:pointer;">📚 기록</button>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <div style="position:absolute; font-size:60px; color:rgba(255,255,255,0.3); pointer-events:none;">+</div>
    </div>

    <div class="capture-btn" onclick="capturePhoto()"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>AI가 분석 중입니다...</p>
    </div>

    <script>
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (e) { alert('카메라 권한을 허용해주세요.'); }
        }

        async function capturePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imgData = canvas.toDataURL('image/jpeg', 0.8);
            
            loading.style.display = 'flex';

            try {
                const res = await fetch('/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imgData.split(',')[1] })
                });
                const data = await res.json();

                if (data.answer) {
                    const session = {
                        id: Date.now(),
                        image: imgData,
                        messages: [{ type: 'ai', content: data.answer, timestamp: Date.now() }],
                        createdAt: Date.now()
                    };
                    
                    const sessions = JSON.parse(localStorage.getItem('chat_sessions') || '[]');
                    sessions.unshift(session);
                    localStorage.setItem('chat_sessions', JSON.stringify(sessions));
                    window.location.href = 'chat.html'; // 답변 페이지로 이동
                }
            } catch (e) { 
                alert('분석에 실패했습니다.'); 
                loading.style.display = 'none'; 
            }
        }
        initCamera();
    </script>
</body>
</html>
