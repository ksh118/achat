<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .header { background: #ff2d55; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .grid img { width: 100%; height: 120px; object-fit: cover; }
        #pop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; overflow-y: auto; }
        .pop-head { background: #ff2d55; color: white; padding: 15px; display: flex; justify-content: space-between; }
        .pop-body { padding: 15px; text-align: center; }
        .pop-body img { width: 100%; border-radius: 10px; }
        .ans-box { text-align: left; background: #f0f0f0; padding: 15px; border-radius: 10px; margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="header" onclick="location.href='index.html'">기록 (뒤로가기)</div>
    <div class="grid" id="g"></div>

    <div id="pop">
        <div class="pop-head"><span onclick="closeP()">＜</span> 문제 풀이 <span>✕</span></div>
        <div class="pop-body">
            <img id="p-img">
            <div class="ans-box" id="p-ans"></div>
        </div>
    </div>

    <script>
        const h = JSON.parse(localStorage.getItem('cb_history') || '[]');
        const g = document.getElementById('g');

        h.forEach((item, i) => {
            const img = document.createElement('img');
            img.src = item.img;
            img.onclick = () => {
                document.getElementById('p-img').src = item.img;
                // [핵심] 저장된 문자열 풀이를 그대로 출력
                document.getElementById('p-ans').innerText = item.ans;
                document.getElementById('pop').style.display = 'block';
            };
            g.appendChild(img);
        });

        function closeP() { document.getElementById('pop').style.display = 'none'; }
    </script>
</body>
</html>
