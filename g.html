<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>codetbase - 기록</title>
    <style>
        body { margin: 0; background: #fff; font-family: sans-serif; }
        .header { background: #ff2d55; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
        .grid img { width: 100%; height: 130px; object-fit: cover; cursor: pointer; }
        
        /* 상세 풀이 모달 */
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; overflow-y: auto; }
        .detail-header { background: #ff2d55; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .detail-content { padding: 15px; text-align: center; }
        .detail-content img { width: 100%; border-radius: 8px; margin-bottom: 20px; }
        .answer-text { text-align: left; background: #f4f4f4; padding: 15px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="header">
        <span onclick="location.href='index.html'" style="cursor:pointer">＜</span>
        <span>기록</span>
        <span>✅</span>
    </div>
    <div class="grid" id="historyGrid"></div>

    <div id="detail-view">
        <div class="detail-header">
            <span onclick="closeDetail()" style="cursor:pointer">＜</span>
            <span>문제 풀이</span>
            <span onclick="closeDetail()" style="cursor:pointer">✕</span>
        </div>
        <div class="detail-content">
            <img id="detail-img">
            <div class="answer-text" id="detail-text"></div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('historyGrid');
        const history = JSON.parse(localStorage.getItem('codetbase_history') || '[]');

        history.forEach((data, index) => {
            const img = document.createElement('img');
            img.src = data.img;
            img.onclick = () => {
                document.getElementById('detail-img').src = data.img;
                document.getElementById('detail-text').innerText = data.answer;
                document.getElementById('detail-view').style.display = 'block';
            };
            grid.appendChild(img);
        });

        function closeDetail() {
            document.getElementById('detail-view').style.display = 'none';
        }
    </script>
</body>
</html>
