<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>codetbase - 기록</title>
    <style>
        body { margin: 0; background: white; font-family: sans-serif; }
        .header { background: #ff2d55; color: white; padding: 15px; text-align: center; font-size: 20px; position: sticky; top: 0; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px; }
        .grid img { width: 100%; height: 120px; object-fit: cover; cursor: pointer; }
        
        /* 풀이 팝업 레이어 */
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; overflow-y: auto; }
        .solve-header { background: #ff2d55; color: white; padding: 15px; display: flex; justify-content: space-between; }
        .content { padding: 20px; text-align: center; }
        .content img { max-width: 90%; border-radius: 10px; margin-bottom: 20px; }
        .answer-box { background: #f0f0f0; padding: 20px; border-radius: 15px; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="header">기록</div>
    <div class="grid" id="historyGrid"></div>

    <div id="detail-view">
        <div class="solve-header">
            <span onclick="closeDetail()" style="cursor:pointer">＜</span>
            <span>문제 풀이</span>
            <span onclick="closeDetail()" style="cursor:pointer">✕</span>
        </div>
        <div class="content">
            <img id="detail-img" src="">
            <div class="answer-box" id="detail-text"></div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('historyGrid');
        const history = JSON.parse(localStorage.getItem('study_history') || '[]');

        // 목록 표시
        history.forEach((item, index) => {
            const img = document.createElement('img');
            img.src = item.img;
            img.onclick = () => showDetail(index);
            grid.appendChild(img);
        });

        function showDetail(index) {
            const item = history[index];
            document.getElementById('detail-img').src = item.img;
            document.getElementById('detail-text').innerText = item.answer;
            document.getElementById('detail-view').style.display = 'block';
        }

        function closeDetail() {
            document.getElementById('detail-view').style.display = 'none';
        }
    </script>
</body>
</html>
